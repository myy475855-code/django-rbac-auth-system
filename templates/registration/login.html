{% extends "base.html" %}{% block title %}Sign in{% endblock %}{% block content %}<section class="form-card"><p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1>{% if form.errors %}<p class="error">Username or password is incorrect.</p>{% endif %}<form method="post">{% csrf_token %}<div class="field"><label for="{{ form.username.id_for_label }}">Username</label>{{ form.username }}</div><div class="field"><label for="{{ form.password.id_for_label }}">Password</label>{{ form.password }}</div>{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="button primary full" type="submit">Sign in securely</button></form><p class="muted center">No account? <a href="{% url 'register' %}">Create one</a></p></section>{% endblock %}
